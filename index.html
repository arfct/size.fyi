<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>size.fyi — compare the size of anything</title>
    <meta name="description" content="Compare the size of devices and everyday objects in 3D." />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-256.png" type="image/png" sizes="256x256" />
    <link rel="apple-touch-icon" href="/icon-256.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1917" />
    <!-- Default share card. Static because `/` matches this asset and the Worker never runs for it, so
         nothing can inject tags here. Comparison pages DO reach the Worker, which strips these and
         appends its own — see the HTMLRewriter in src/worker/index.ts. `v` is the card design version
         (OG_VERSION); the default card is drawn from constants, so that is a complete cache key. -->
    <meta property="og:title" content="size.fyi — compare the size of anything" />
    <meta property="og:description" content="Compare the size of devices and everyday objects in 3D." />
    <meta property="og:url" content="https://size.fyi/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://size.fyi/api/og/default?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="600" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://size.fyi/api/og/default?v=2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
