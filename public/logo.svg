<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- size.fyi mark: overlapping squares whose intersections blend into new colors (rotated 90° CW) -->
  <g transform="rotate(90 64 64)">
    <rect x="18" y="52" width="88" height="64" fill="#6EB5E8"/>            <!-- blue square -->
    <rect x="48" y="10" width="62" height="44" fill="#F5D93F"/>            <!-- yellow (pure top) -->
    <rect x="48" y="54" width="62" height="34" fill="#E9A83C"/>            <!-- yellow ∩ blue = amber -->
    <rect x="82" y="60" width="28" height="28" fill="#E9744B"/>            <!-- coral square -->
    <rect x="82" y="88" width="22" height="16" fill="#E7469D"/>            <!-- pink square -->
  </g>
</svg>
